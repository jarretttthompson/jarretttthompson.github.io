<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/breakcomposer/logo-simple.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <link rel="manifest" href="/breakcomposer/manifest.json" />
    <title>breakComposer</title>
    <!--
      Viewport fix for mobile browsers:
      - visualViewport.height → --bc-vh (visible height, excludes most chrome)
      - visualViewport.offsetTop → --bc-vp-offset-top (gap from layout viewport top;
        pushes #root down so the toolbar isn’t drawn under the tab/address bar)
    -->
    <script>
      (function () {
        function updateVh() {
          var vp = window.visualViewport;
          if (vp) {
            document.documentElement.style.setProperty('--bc-vh', vp.height + 'px');
            document.documentElement.style.setProperty(
              '--bc-vp-offset-top',
              Math.max(0, vp.offsetTop) + 'px'
            );
          } else {
            document.documentElement.style.setProperty('--bc-vh', window.innerHeight + 'px');
            document.documentElement.style.setProperty('--bc-vp-offset-top', '0px');
          }
        }
        updateVh();
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', updateVh);
          window.visualViewport.addEventListener('scroll', updateVh);
        }
        window.addEventListener('resize', updateVh);
        window.addEventListener('orientationchange', function () {
          setTimeout(updateVh, 100);
        });
        /* Re-run after a short delay so any initial browser-chrome animation settles */
        setTimeout(updateVh, 300);
        setTimeout(updateVh, 800);
      })();
    </script>
    <script type="module" crossorigin src="/breakcomposer/assets/index-BZjjttJl.js"></script>
    <link rel="stylesheet" crossorigin href="/breakcomposer/assets/index-DwoNwjap.css">
    <link rel="stylesheet" href="/breakcomposer/breakcomposer-mobile.css" />
  </head>
  <body>
    <div id="root"></div>

    <script>
      // ── Logo overlay ──
      (() => {
        const FULL_SRC = '/breakcomposer/logo-full.png';
        const ID = 'breakcomposer-full-logo';
        const MAX_TRIES = 200;

        let tries = 0;
        let placementInterval = null;
        let processedSrc = null;
        let logoLocked = false;

        function findToolbarEl(root) {
          return (
            root.querySelector('[class*="toolbar-safe-top"]') ||
            root.querySelector('[class*="toolbar-compact"]') ||
            root.querySelector('[class*="toolbar"]') ||
            null
          );
        }

        /**
         * Largest canvas is almost always the piano roll (huge area). We use it only
         * as a landmark so the logo gap is toolbar → top of staff, not toolbar → piano roll
         * (centering in the latter was drawing the logo on top of the notation).
         */
        function findPianoRollCanvasRect(root) {
          const canvases = Array.from(root.querySelectorAll('canvas'));
          if (!canvases.length) return null;
          let best = null;
          let bestArea = -1;
          for (const el of canvases) {
            const r = el.getBoundingClientRect();
            const area = r.width * r.height;
            if (area > bestArea) {
              bestArea = area;
              best = r;
            }
          }
          return best && best.width > 40 && best.height > 40 ? best : null;
        }

        /**
         * Notation staff is the wide SVG sitting directly above the piano roll (short
         * height, full width). Do not use area-based scoring — that picks the roll canvas.
         */
        function findStaffNotationRect(root, toolbarRect) {
          const piano = findPianoRollCanvasRect(root);
          const tb = toolbarRect ? toolbarRect.bottom : 0;
          const svgs = Array.from(root.querySelectorAll('svg'));
          const pad = 6;
          let best = null;
          let bestBottom = -Infinity;

          for (const el of svgs) {
            const r = el.getBoundingClientRect();
            if (r.width < 120 || r.height < 28 || r.height > 420) continue;
            if (r.top < tb - 4) continue;
            if (piano) {
              if (r.bottom > piano.top + pad) continue;
              if (r.bottom <= piano.top + pad && r.bottom > bestBottom) {
                bestBottom = r.bottom;
                best = r;
              }
            } else {
              if (r.bottom > bestBottom) {
                bestBottom = r.bottom;
                best = r;
              }
            }
          }

          if (best) return best;

          if (piano) {
            let relaxed = null;
            let relaxedBottom = -Infinity;
            for (const el of svgs) {
              const r = el.getBoundingClientRect();
              if (r.width < 120 || r.height < 28 || r.height > 420) continue;
              if (r.top < tb - 4) continue;
              if (r.top >= piano.top) continue;
              if (r.bottom > relaxedBottom) {
                relaxedBottom = r.bottom;
                relaxed = r;
              }
            }
            if (relaxed) return relaxed;
          }

          const fallback = svgs
            .map((el) => el.getBoundingClientRect())
            .filter((r) => r.width >= 120 && r.height >= 28 && r.height <= 420 && r.top >= tb - 4)
            .sort((a, b) => b.top - a.top);
          return fallback[0] || null;
        }

        function processFullLogoToTransparentCropped(src) {
          return new Promise((resolve) => {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => {
              try {
                const w = img.naturalWidth;
                const h = img.naturalHeight;
                const canvas = document.createElement('canvas');
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                if (!ctx) return resolve(src);
                ctx.drawImage(img, 0, 0);
                const imgData = ctx.getImageData(0, 0, w, h);
                const data = imgData.data;
                const isNearBlack = (r, g, b) => {
                  const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
                  return lum < 18 && r < 45 && g < 45 && b < 45;
                };
                const contentMask = new Uint8Array(w * h);
                let hasContent = false;
                for (let y = 0; y < h; y++) {
                  for (let x = 0; x < w; x++) {
                    const p = (y * w + x) * 4;
                    const r = data[p], g = data[p + 1], b = data[p + 2], a = data[p + 3];
                    if (a === 0) continue;
                    if (!isNearBlack(r, g, b)) {
                      contentMask[y * w + x] = 1;
                      hasContent = true;
                    }
                  }
                }
                if (!hasContent) return resolve(src);
                const radius = 8;
                const iw = w + 1;
                const ih = h + 1;
                const integral = new Uint32Array(iw * ih);
                for (let y = 1; y <= h; y++) {
                  let rowSum = 0;
                  for (let x = 1; x <= w; x++) {
                    rowSum += contentMask[(y - 1) * w + (x - 1)];
                    integral[y * iw + x] = integral[(y - 1) * iw + x] + rowSum;
                  }
                }
                const rectSum = (x0, y0, x1, y1) => {
                  const X0 = Math.max(0, x0);
                  const Y0 = Math.max(0, y0);
                  const X1 = Math.min(w - 1, x1);
                  const Y1 = Math.min(h - 1, y1);
                  if (X1 < X0 || Y1 < Y0) return 0;
                  const A = integral[(Y0) * iw + (X0)];
                  const B = integral[(Y0) * iw + (X1 + 1)];
                  const C = integral[(Y1 + 1) * iw + (X0)];
                  const D = integral[(Y1 + 1) * iw + (X1 + 1)];
                  return D - B - C + A;
                };
                const mask = new Uint8Array(w * h);
                let minX = w, minY = h, maxX = 0, maxY = 0;
                for (let y = 0; y < h; y++) {
                  for (let x = 0; x < w; x++) {
                    const idx = y * w + x;
                    const sum = rectSum(x - radius, y - radius, x + radius, y + radius);
                    if (sum > 0) {
                      mask[idx] = 1;
                      if (x < minX) minX = x;
                      if (y < minY) minY = y;
                      if (x > maxX) maxX = x;
                      if (y > maxY) maxY = y;
                    }
                  }
                }
                if (maxX <= minX || maxY <= minY) return resolve(src);
                const pad = 4;
                minX = Math.max(0, minX - pad);
                minY = Math.max(0, minY - pad);
                maxX = Math.min(w - 1, maxX + pad);
                maxY = Math.min(h - 1, maxY + pad);
                const cropW = maxX - minX + 1;
                const cropH = maxY - minY + 1;
                for (let y = 0; y < h; y++) {
                  for (let x = 0; x < w; x++) {
                    const idx = y * w + x;
                    const p = idx * 4;
                    const r = data[p], g = data[p + 1], b = data[p + 2];
                    if (mask[idx] === 0) { data[p + 3] = 0; continue; }
                    if (isNearBlack(r, g, b)) { data[p] = 0; data[p + 1] = 0; data[p + 2] = 0; data[p + 3] = 255; }
                    else { data[p + 3] = 255; }
                  }
                }
                const out = document.createElement('canvas');
                out.width = cropW;
                out.height = cropH;
                const outCtx = out.getContext('2d', { willReadFrequently: false });
                if (!outCtx) return resolve(src);
                const tmp = document.createElement('canvas');
                tmp.width = w;
                tmp.height = h;
                const tmpCtx = tmp.getContext('2d', { willReadFrequently: true });
                if (!tmpCtx) return resolve(src);
                tmpCtx.putImageData(imgData, 0, 0);
                outCtx.drawImage(tmp, minX, minY, cropW, cropH, 0, 0, cropW, cropH);
                resolve(out.toDataURL('image/png'));
              } catch { resolve(src); }
            };
            img.onerror = () => resolve(src);
            img.src = src;
          });
        }

        function positionOverlay(img, staffRect, toolbarRect) {
          if (!staffRect) return;
          const isMobile = window.matchMedia('(max-width: 768px), (pointer: coarse)').matches;
          if (isMobile) { img.style.display = 'none'; return; }
          img.style.display = 'block';
          const margin = 8;
          const gapTop = toolbarRect.bottom + margin;
          const gapBottom = staffRect.top - margin;
          const gapHeight = gapBottom - gapTop;
          if (gapHeight <= 4) return;
          const padding = 6;
          const usableHeight = Math.max(0, gapHeight - padding * 2);
          if (usableHeight <= 8) return;
          const aspect = img.naturalWidth > 0 ? (img.naturalWidth / img.naturalHeight) : 1;
          let height = Math.min(usableHeight * 0.92, usableHeight);
          height = Math.max(32, Math.min(usableHeight, height));
          let width = height * aspect;
          const maxWidth = Math.min(staffRect.width, (window.innerWidth || 1200) * 0.85);
          if (width > maxWidth) { width = maxWidth; height = width / Math.max(1e-6, aspect); }
          if (height > usableHeight) { height = usableHeight; width = height * aspect; }
          const left = staffRect.left;
          const top = gapTop + padding + (usableHeight - height) / 2;
          img.style.left = `${left}px`;
          img.style.top = `${top}px`;
          img.style.width = `${width}px`;
          img.style.height = `${height}px`;
          img.style.objectFit = 'contain';
          img.style.objectPosition = 'left center';
          img.style.borderRadius = '0px';
          img.style.border = 'none';
          img.style.opacity = '1';
        }

        let imgEl = document.getElementById(ID);
        if (!imgEl) {
          imgEl = document.createElement('img');
          imgEl.id = ID;
          imgEl.alt = 'breakComposer logo';
          imgEl.draggable = false;
          imgEl.style.position = 'fixed';
          imgEl.style.zIndex = '2147483646';
          imgEl.style.pointerEvents = 'none';
          imgEl.style.display = 'block';
          imgEl.style.opacity = '0';
          imgEl.style.filter = 'drop-shadow(0 0 10px rgba(224, 111, 234, 0.18))';
          imgEl.style.transform = 'translateZ(0)';
          imgEl.style.willChange = 'top, left, width, height, opacity';
          document.body.appendChild(imgEl);
        }

        processFullLogoToTransparentCropped(FULL_SRC).then((src) => {
          processedSrc = src;
          imgEl.src = processedSrc || FULL_SRC;
        });

        placementInterval = window.setInterval(() => {
          try {
            if (logoLocked) { window.clearInterval(placementInterval); return; }
            const root = document.getElementById('root');
            if (!root) return;
            const toolbarEl = findToolbarEl(root);
            const toolbarRect = toolbarEl ? toolbarEl.getBoundingClientRect() : { bottom: 120, left: 0, top: 0, right: 0, width: 0, height: 0 };
            const staffRect = findStaffNotationRect(root, toolbarRect);
            if (!staffRect) { if (tries++ >= MAX_TRIES) window.clearInterval(placementInterval); return; }
            positionOverlay(imgEl, staffRect, toolbarRect);
            if (imgEl.complete && imgEl.naturalWidth) {
              logoLocked = true;
              imgEl.style.willChange = 'auto';
              window.clearInterval(placementInterval);
              return;
            }
          } catch (e) { if (tries++ >= MAX_TRIES) window.clearInterval(placementInterval); }
        }, 200);
      })();
    </script>

    <script>
      // ── Mobile touch controls (Select / Copy / Accent / Ghost) ──
      (() => {
        const isTouchDevice = () => 'ontouchstart' in window || navigator.maxTouchPoints > 0;

        const SELECT_ID = 'bc-mobile-select-btn';
        const COPY_ID   = 'bc-mobile-copy-btn';
        const ACCENT_ID = 'bc-mobile-accent-btn';
        const GHOST_ID  = 'bc-mobile-ghost-btn';
        const DOCK_ID   = 'bc-mobile-dock';

        let selectMode = false;
        let copyMode = false;

        let canvasEl = null;
        let listenersAttached = false;
        let gestureActive = false;
        let activePointerId = null;

        const STATE = {
          selectModeEnabled: () => selectMode,
          copyModeEnabled: () => copyMode,
          setCopyMode: (v) => { copyMode = v; updateDockStyles(); },
          setSelectMode: (v) => { selectMode = v; updateDockStyles(); },
        };

        function $id(id) { return document.getElementById(id); }

        function updateDockStyles() {
          const selectBtn = $id(SELECT_ID);
          const copyBtn = $id(COPY_ID);
          if (selectBtn) {
            selectBtn.classList.toggle('bc-dock-btn--active', selectMode);
            selectBtn.setAttribute('aria-pressed', String(!!selectMode));
          }
          if (copyBtn) {
            copyBtn.classList.toggle('bc-dock-btn--active', copyMode);
            copyBtn.setAttribute('aria-pressed', String(!!copyMode));
          }
        }

        function fireKeyOnCanvas(key, opts) {
          if (!canvasEl) return;
          const ev = new KeyboardEvent('keydown', { key, bubbles: true, cancelable: true, ...opts });
          canvasEl.dispatchEvent(ev);
          setTimeout(() => {
            canvasEl.dispatchEvent(new KeyboardEvent('keyup', { key, bubbles: true, cancelable: true, ...opts }));
          }, 60);
        }

        function createDock() {
          if ($id(DOCK_ID)) return;
          const dock = document.createElement('div');
          dock.id = DOCK_ID;
          dock.className = 'bc-mobile-dock';

          const btns = [
            { id: SELECT_ID, label: 'Select', ariaLabel: 'Select notes (mobile)', icon: '⬚', toggle: true },
            { id: COPY_ID,   label: 'Copy',   ariaLabel: 'Copy selected notes',   icon: '⧉', toggle: true },
            { id: ACCENT_ID, label: 'Accent', ariaLabel: 'Accent selected notes',  icon: '>', toggle: false },
            { id: GHOST_ID,  label: 'Ghost',  ariaLabel: 'Ghost selected notes',   icon: '○', toggle: false },
          ];

          btns.forEach(({ id, label, ariaLabel, icon, toggle }) => {
            const btn = document.createElement('button');
            btn.id = id;
            btn.type = 'button';
            btn.className = 'bc-dock-btn';
            btn.setAttribute('aria-label', ariaLabel);
            btn.innerHTML = `<span class="bc-dock-btn__icon">${icon}</span><span class="bc-dock-btn__label">${label}</span>`;

            btn.addEventListener('click', () => {
              if (id === SELECT_ID) STATE.setSelectMode(!selectMode);
              else if (id === COPY_ID) STATE.setCopyMode(!copyMode);
              else if (id === ACCENT_ID) fireKeyOnCanvas('Shift', { shiftKey: true });
              else if (id === GHOST_ID)  fireKeyOnCanvas('Alt', { altKey: true });
            });

            dock.appendChild(btn);
          });

          document.body.appendChild(dock);
        }

        function findToolbarEl(root) {
          return (
            root.querySelector('[class*="toolbar-safe-top"]') ||
            root.querySelector('[class*="toolbar-compact"]') ||
            root.querySelector('[class*="toolbar"]') ||
            null
          );
        }

        function findPianoRollCanvas() {
          const root = document.getElementById('root');
          if (!root) return null;
          const toolbarEl = findToolbarEl(root);
          const toolbarRect = toolbarEl ? toolbarEl.getBoundingClientRect() : { bottom: 0 };
          const canvases = Array.from(root.querySelectorAll('canvas'));
          if (!canvases.length) return null;
          let best = null;
          for (const c of canvases) {
            const r = c.getBoundingClientRect();
            if (!r.width || !r.height) continue;
            if (r.top < toolbarRect.bottom + 80) continue;
            const area = r.width * r.height;
            const score = area + (r.height > 250 ? 1e7 : 0) + (r.top > toolbarRect.bottom + 150 ? 1e9 : 0);
            if (!best || score > best.score) best = { canvas: c, score, r };
          }
          return best?.canvas || null;
        }

        function dispatchMouse(target, type, x, y, options) {
          target.dispatchEvent(new MouseEvent(type, { bubbles: true, cancelable: true, clientX: x, clientY: y, ...options }));
        }

        function attachCanvasListenersIfNeeded() {
          if (!canvasEl || listenersAttached) return;

          canvasEl.addEventListener('pointerdown', (e) => {
            if (!selectMode && !copyMode) return;
            if (e.pointerType === 'mouse') return;
            if (activePointerId !== null) return;
            activePointerId = e.pointerId;
            gestureActive = true;
            e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation?.();
            const opts = selectMode
              ? { button: 2, buttons: 2 }
              : { button: 0, buttons: 1, metaKey: true, ctrlKey: true };
            dispatchMouse(canvasEl, 'mousedown', e.clientX, e.clientY, opts);
          }, { passive: false, capture: true });

          canvasEl.addEventListener('pointermove', (e) => {
            if (!gestureActive || (!selectMode && !copyMode)) return;
            if (e.pointerType === 'mouse' || activePointerId !== e.pointerId) return;
            e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation?.();
            const opts = selectMode
              ? { buttons: 2, button: 2 }
              : { buttons: 1, button: 0, metaKey: true, ctrlKey: true };
            dispatchMouse(canvasEl, 'mousemove', e.clientX, e.clientY, opts);
          }, { passive: false, capture: true });

          const endPointer = (e) => {
            if (!gestureActive || e.pointerType === 'mouse' || activePointerId !== e.pointerId) return;
            e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation?.();
            gestureActive = false;
            activePointerId = null;
            const opts = selectMode
              ? { button: 2, buttons: 0 }
              : { button: 0, buttons: 0, metaKey: true, ctrlKey: true };
            dispatchMouse(canvasEl, 'mouseup', e.clientX, e.clientY, opts);
            if (copyMode) STATE.setCopyMode(false);
          };

          canvasEl.addEventListener('pointerup', endPointer, { passive: false, capture: true });
          canvasEl.addEventListener('pointercancel', endPointer, { passive: false, capture: true });

          canvasEl.addEventListener('touchstart', (e) => {
            if (!selectMode && !copyMode) return;
            const t = e.touches?.[0]; if (!t) return;
            e.preventDefault(); e.stopPropagation(); gestureActive = true;
            const opts = selectMode ? { button: 2, buttons: 2 } : { button: 0, buttons: 1, metaKey: true, ctrlKey: true };
            dispatchMouse(canvasEl, 'mousedown', t.clientX, t.clientY, opts);
          }, { passive: false, capture: true });

          canvasEl.addEventListener('touchmove', (e) => {
            if (!gestureActive || (!selectMode && !copyMode)) return;
            const t = e.touches?.[0]; if (!t) return;
            e.preventDefault(); e.stopPropagation();
            const opts = selectMode ? { buttons: 2, button: 2 } : { buttons: 1, button: 0, metaKey: true, ctrlKey: true };
            dispatchMouse(canvasEl, 'mousemove', t.clientX, t.clientY, opts);
          }, { passive: false, capture: true });

          canvasEl.addEventListener('touchend', (e) => {
            if (!gestureActive || (!selectMode && !copyMode)) return;
            e.preventDefault(); e.stopPropagation(); gestureActive = false;
            const t = e.changedTouches?.[0];
            const x = t ? t.clientX : 0, y = t ? t.clientY : 0;
            const opts = selectMode ? { button: 2, buttons: 0 } : { button: 0, buttons: 0, metaKey: true, ctrlKey: true };
            dispatchMouse(canvasEl, 'mouseup', x, y, opts);
            if (copyMode) STATE.setCopyMode(false);
          }, { passive: false, capture: true });

          canvasEl.addEventListener('touchcancel', (e) => {
            if (!gestureActive) return;
            gestureActive = false;
          }, { passive: false, capture: true });

          listenersAttached = true;
        }

        if (isTouchDevice()) createDock();
        updateDockStyles();

        let canvasFindInterval = window.setInterval(() => {
          try {
            const nextCanvas = findPianoRollCanvas();
            if (nextCanvas && nextCanvas !== canvasEl) {
              canvasEl = nextCanvas;
              listenersAttached = false;
              gestureActive = false;
            }
            attachCanvasListenersIfNeeded();
          } catch {}
        }, 200);

        window.setTimeout(() => {
          try { if (listenersAttached) window.clearInterval(canvasFindInterval); } catch {}
        }, 15000);
      })();
    </script>

    <script>
      // ── "How to use" help modal ──
      (() => {
        const BTN_ID = 'bc-help-button';
        const MODAL_ID = 'bc-help-modal';
        const STORAGE_KEY = 'breakcomposer_help_dismissed_v2';
        const isMobile = () => 'ontouchstart' in window || navigator.maxTouchPoints > 0;

        function $(id) { return document.getElementById(id); }

        function createStyles() {
          const styleId = 'bc-help-styles';
          if ($(styleId)) return;
          const style = document.createElement('style');
          style.id = styleId;
          style.textContent = `

            #${MODAL_ID} .title {

              margin: 0;
              font-size: 15px;
              font-family: 'Vulf Mono', ui-monospace, monospace;
              color: #00ff9f;
              text-shadow: 0 0 8px rgba(0, 255, 159, 0.4);
              letter-spacing: 0.04em;
            }
            #${MODAL_ID} button.close {
              border: 1px solid rgba(255, 65, 175, 0.3);
              background: linear-gradient(180deg, rgba(255, 65, 175, 0.12) 0%, rgba(255, 65, 175, 0.06) 100%);
              color: #eedcff;
              border-radius: 8px;
              padding: 6px 12px;
              cursor: pointer;
              font-family: 'Vulf Mono', ui-monospace, monospace;
              font-size: 12px;
              box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
            }
            #${MODAL_ID} .content {
              font-size: 13px;
              line-height: 1.55;
              color: rgba(238, 220, 255, 0.88);
              font-family: 'Vulf Sans', system-ui, sans-serif;
            }
            #${MODAL_ID} ol {
              margin: 12px 0 0 20px;
              padding: 0;
            }
            #${MODAL_ID} li { margin: 8px 0; }
            #${MODAL_ID} .kbd {
              border: 1px solid rgba(0, 255, 159, 0.18);
              background: rgba(0, 255, 159, 0.06);
              padding: 1px 6px;
              border-radius: 6px;
              font-family: 'Vulf Mono', ui-monospace, monospace;
              color: #00ff9f;
              font-size: 11px;
            }
            #${MODAL_ID} .mobile-note {
              margin-top: 14px;
              padding: 10px 12px;
              background: rgba(255, 65, 175, 0.06);
              border: 1px solid rgba(255, 65, 175, 0.18);
              border-radius: 8px;
              font-size: 12px;
              color: rgba(238, 220, 255, 0.8);
            }
            #${MODAL_ID} .mobile-note strong { color: #ff41af; }
          `;
          document.head.appendChild(style);
        }

        function openModal() {
          const modal = $(MODAL_ID);
          if (!modal) return;
          modal.setAttribute('data-open', 'true');
          modal.querySelector('button.close')?.focus();
        }

        function closeModal() {
          const modal = $(MODAL_ID);
          if (!modal) return;
          modal.setAttribute('data-open', 'false');
          try { localStorage.setItem(STORAGE_KEY, '1'); } catch {}
        }

        function ensureUI() {
          if ($(BTN_ID)) return;
          createStyles();

          const btn = document.createElement('button');
          btn.id = BTN_ID;
          btn.type = 'button';
          btn.textContent = '?';
          btn.setAttribute('aria-label', 'How to use breakComposer');
          btn.addEventListener('click', () => openModal());

          const modal = document.createElement('div');
          modal.id = MODAL_ID;
          modal.setAttribute('data-open', 'false');

          const mobileBlock = isMobile() ? `
            <div class="mobile-note">
              <strong>Mobile controls:</strong> Use the floating dock at the bottom.
              <b>Select</b> toggles multi-note selection (drag to lasso).
              <b>Copy</b> duplicates selected notes on next drag.
              <b>Accent</b> / <b>Ghost</b> modify selected notes.
            </div>` : '';

          modal.innerHTML = `
            <div class="panel" role="dialog" aria-modal="true" aria-label="How to use breakComposer">
              <div class="title">
                <h3>How to use breakComposer</h3>
                <button class="close" type="button">Close</button>
              </div>
              <div class="content">
                <ol>
                  <li>Tap or click the piano roll to place notes — the notation updates automatically.</li>
                  <li>Select multiple notes by right-click dragging (desktop) or toggling <b>Select</b> then dragging (mobile).</li>
                  <li>Move selected notes by dragging them across the piano roll.</li>
                  <li>Copy notes with <span class="kbd">⌘</span>/<span class="kbd">Ctrl</span> + drag (desktop) or the <b>Copy</b> button (mobile).</li>
                  <li>Use <b>Clear</b> to start fresh, or <b>Breakbeat</b> to generate a pattern you can then edit.</li>
                  <li>Accent with <span class="kbd">Shift</span>, ghost with <span class="kbd">Alt</span> — or use the mobile dock buttons.</li>
                  <li>Adjust tempo and time signature in the toolbar.</li>
                </ol>
                ${mobileBlock}
              </div>
            </div>
          `;

          modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
          modal.querySelector('button.close')?.addEventListener('click', closeModal);
          window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

          document.body.appendChild(btn);
          document.body.appendChild(modal);

          function findToolbarEl(root) {
            return (
              root.querySelector('[class*="toolbar-safe-top"]') ||
              root.querySelector('[class*="toolbar-compact"]') ||
              root.querySelector('[class*="toolbar"]') ||
              null
            );
          }

          function findBpmAnchor(toolbarEl) {
            const els = Array.from(toolbarEl.querySelectorAll('*'));
            return els.find((el) => /\bBPM\b/i.test((el.textContent || '').trim())) || null;
          }

          function tryInsertInToolbar() {
            const root = document.getElementById('root');
            if (!root) return false;
            const toolbarEl = findToolbarEl(root);
            if (!toolbarEl || toolbarEl.contains(btn)) return !!toolbarEl?.contains(btn);
            btn.style.padding = '6px 10px';
            btn.style.borderRadius = '10px';
            btn.style.marginLeft = '6px';
            const bpmEl = findBpmAnchor(toolbarEl);
            if (bpmEl?.parentElement) { bpmEl.parentElement.insertBefore(btn, bpmEl); return true; }
            toolbarEl.appendChild(btn);
            return true;
          }

          const interval = window.setInterval(() => {
            try { if (tryInsertInToolbar()) window.clearInterval(interval); } catch {}
          }, 200);
        }

        try {
          ensureUI();
          if (localStorage.getItem(STORAGE_KEY) === '1') {
            const modal = $(MODAL_ID);
            if (modal) modal.setAttribute('data-open', 'false');
          }
        } catch { ensureUI(); }
      })();
    </script>
  </body>
</html>
